services:
  redis:
    image: redis:7.4-alpine
    container_name: reie-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  typesense:
    image: typesense/typesense:27.1
    container_name: reie-typesense
    restart: unless-stopped
    ports:
      - "8109:8108"
    volumes:
      - ./typesense-data:/data
    command: "--data-dir /data --api-key=xyz --enable-cors"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8108/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:

# docker-compose.yml
